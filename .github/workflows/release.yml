name: release
# Publishes a GitHub release for every pushed version tag (v0.4.0, ...), with the notes
# from that version's CHANGELOG.md section. Steps: CONTRIBUTING.md#releasing.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -p "test_*.py"
      - name: Tag, version and changelog agree
        run: python3 tools/release_notes.py "$GITHUB_REF_NAME" > release-notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "time-assistant $GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
