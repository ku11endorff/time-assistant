name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests (offline, fake targets; includes the target contract suite)
        run: python3 -m unittest discover -s tests -p "test_*.py"
      - name: Agent instruction files are up to date
        run: python3 tools/build_adapters.py --check
      - name: Example files are valid
        run: |
          python3 -m json.tool schema/week.schema.json > /dev/null
          python3 sync.py validate --week examples/week.example.json
          python3 sync.py --config config.example.json check-config
          python3 sync.py --config examples/config.two-targets.example.json check-config
      - name: Shell scripts parse
        run: bash -n tk.sh && bash -n Sync.command
